name: Refresh book radar
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2,14 * * *'
permissions:
  contents: write
concurrency:
  group: pishkhan-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s backend/tests -p 'test_book*.py' -v
      - run: python backend/scripts/collect_book_radar.py --catalog web-static/data/books.json
      - run: |
          git config user.name 'Pishkhan Books'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-static/data/books.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh independently collected book radar'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: book-radar-data
          path: web-static/data/books.json
